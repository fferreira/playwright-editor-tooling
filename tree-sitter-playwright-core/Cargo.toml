[package]
name = "tree-sitter-playwright-core"
description = "Core Playwright grammar for tree-sitter"
version = "0.1.0"
authors = ["Francisco Ferreira"]
license = "MIT"
repository = "https://github.com/fferreira/playwright-editor-tooling"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "playwright_core", "playwright"]
categories = ["parser-implementations", "parsing", "text-editors"]
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.25"
